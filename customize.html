<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡牌定制 - 天下英雄杀</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #080b14;
      --surface: rgba(9, 13, 23, 0.91);
      --surface-soft: rgba(19, 25, 38, 0.78);
      --line: rgba(218, 227, 246, 0.18);
      --line-bright: rgba(225, 233, 250, 0.4);
      --text: #f1f3f7;
      --muted: #a9b1c1;
      --gold: #d7b466;
      --gold-light: #f0d18a;
      --red: #9b403b;
      --green: #81aaa0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-width: 1000px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    .scene {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url("imlobby.png") center / cover no-repeat;
      transform: scale(1.015);
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(4, 7, 14, 0.66), rgba(4, 7, 14, 0.34) 44%, rgba(4, 7, 14, 0.78)),
        linear-gradient(0deg, rgba(3, 5, 11, 0.78), transparent 52%);
    }

    .shell {
      width: min(1240px, calc(100% - 64px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 26px 0 22px;
    }

    .topbar,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .topbar {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-family: SimSun, STSong, serif;
      color: var(--gold-light);
      font-size: 23px;
      font-weight: 700;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(129, 170, 160, 0.7);
    }

    .main {
      padding: 30px 0;
    }

    .hero-panel {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 22px;
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top-color: var(--line-bright);
      border-radius: 6px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(10px);
    }

    .eyebrow {
      margin-bottom: 7px;
      color: var(--gold);
      font-size: 12px;
    }

    h1 {
      font-family: SimSun, STSong, serif;
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .panel-copy {
      margin-top: 10px;
      max-width: 610px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .room-code {
      color: var(--gold-light);
      font-family: Consolas, "Courier New", monospace;
      font-size: 30px;
      line-height: 1;
      white-space: nowrap;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      min-height: 410px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 16px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.015)),
        var(--surface-soft);
      border: 1px solid var(--line);
      border-top-color: rgba(215, 180, 102, 0.35);
      border-radius: 6px;
      box-shadow: 0 18px 52px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .card-title {
      color: var(--gold-light);
      font-family: SimSun, STSong, serif;
      font-size: 18px;
      font-weight: 700;
    }

    .card-number {
      color: var(--muted);
      font-size: 12px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field span {
      color: #dce1eb;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--line);
      border-radius: 4px;
      outline: none;
    }

    input {
      min-height: 44px;
      padding: 10px 12px;
    }

    textarea {
      min-height: 205px;
      resize: none;
      padding: 12px;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(217, 181, 104, 0.1);
    }

    input::placeholder,
    textarea::placeholder {
      color: #70798c;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 22px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      backdrop-filter: blur(10px);
    }

    .hint {
      margin-right: auto;
      color: var(--muted);
      font-size: 13px;
    }

    .submit-button {
      min-width: 150px;
      min-height: 46px;
      border-radius: 4px;
      cursor: pointer;
      background: var(--red);
      border: 1px solid rgba(238, 173, 143, 0.46);
      font-weight: 700;
    }

    .submit-button:hover,
    .submit-button:focus-visible {
      background: #aa4842;
      outline: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 10;
      width: min(460px, calc(100% - 32px));
      padding: 13px 18px;
      background: rgba(8, 12, 20, 0.96);
      border: 1px solid var(--line-bright);
      border-radius: 4px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      text-align: center;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 1180px) {
      .cards {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">天下英雄杀</div>
      <div class="connection">
        <span class="connection-dot" aria-hidden="true"></span>
        <span id="connectionText">卡牌定制</span>
      </div>
    </header>

    <main class="main">
      <section class="hero-panel" aria-labelledby="customize-title">
        <div>
          <p class="eyebrow">AI 卡牌工坊</p>
          <h1 id="customize-title">定制你的英雄卡</h1>
          <p class="panel-copy">描述人物身份、性格和擅长方向。AI 会从受控技能库中匹配技能与数值，服务端校验通过后进入对局。</p>
        </div>
        <strong class="room-code" id="roomCode">------</strong>
      </section>

      <form id="customizeForm">
        <section class="cards" id="cards" aria-label="英雄定制卡片"></section>

        <div class="actions">
          <p class="hint" id="playerHint">填写完成后提交，所有玩家完成后进入对局。</p>
          <button class="submit-button sound-button" type="submit">提交定制</button>
        </div>
      </form>
    </main>

    <footer class="footer">
      <span>AI 生成 · 服务端规则校验</span>
      <span>测试阶段 · 每名玩家 1 张英雄卡</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="buttonSound" src="按钮声音.mp3" preload="auto"></audio>
  <script src="network.js"></script>

  <script>
    const roomStorageKey = 'heroKillLocalRooms';
    const sessionStorageKey = 'heroKillRoomSession';
    const cardCount = 1;
    let roomSession;

    try {
      roomSession = JSON.parse(sessionStorage.getItem(sessionStorageKey));
    } catch {
      roomSession = null;
    }

    function getRooms() {
      try {
        return JSON.parse(localStorage.getItem(roomStorageKey)) || {};
      } catch {
        return {};
      }
    }

    function saveRooms(rooms) {
      if (window.HeroKillNet) return window.HeroKillNet.saveRooms(rooms);
      localStorage.setItem(roomStorageKey, JSON.stringify(rooms));
      return Promise.resolve(rooms);
    }

    function allPlayersSubmitted(room) {
      return Boolean(room?.players?.length) && room.players.every((roomPlayer) => {
        const submission = room.customizations?.[roomPlayer.id];
        return submission?.cards?.length === cardCount;
      });
    }

    function allHeroesReady(room) {
      return room?.heroGeneration?.status === 'READY'
        && Boolean(room?.players?.length)
        && room.players.every((roomPlayer) => room.generatedHeroes?.[roomPlayer.id]);
    }

    async function submitCustomization(roomCode, playerId, cards) {
      const response = await fetch(`/api/rooms/${roomCode}/customizations`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId, cards })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.message || `提交失败：${response.status}`);
      return payload;
    }

    function playSound() {
      const sound = document.getElementById('buttonSound');
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      clearTimeout(showToast.timer);
      toast.textContent = message;
      toast.classList.add('visible');
      showToast.timer = setTimeout(() => toast.classList.remove('visible'), 2600);
    }

    function createCard(index, savedCard) {
      const article = document.createElement('article');
      article.className = 'card';
      article.innerHTML = `
        <div class="card-head">
          <span class="card-title">空白英雄卡</span>
          <span class="card-number">${String(index + 1).padStart(2, '0')}</span>
        </div>
        <label class="field">
          <span>英雄名称</span>
          <input name="heroName${index}" type="text" maxlength="16" placeholder="例如：奥特曼" required autocomplete="off">
        </label>
        <label class="field">
          <span>英雄描述</span>
          <textarea name="heroDescription${index}" maxlength="120" placeholder="描述人物特征、擅长方向或你希望技能体现的风格，比如：奥特曼来自光之国，打怪兽猛猛的。" required></textarea>
        </label>
      `;

      if (savedCard) {
        article.querySelector('input').value = savedCard.name || '';
        article.querySelector('textarea').value = savedCard.description || '';
      }

      return article;
    }

    if (!roomSession || !/^\d{6}$/.test(roomSession.roomCode)) {
      window.location.replace('lobby.html');
    } else {
      const rooms = getRooms();
      const room = rooms[roomSession.roomCode];
      const player = room?.players.find((item) => item.id === roomSession.playerId);

      if (!room || !player) {
        sessionStorage.removeItem(sessionStorageKey);
        window.location.replace('lobby.html');
      } else {
        const submitButton = document.querySelector('.submit-button');
        const savedCards = room.customizations?.[roomSession.playerId]?.cards || [];
        document.getElementById('roomCode').textContent = roomSession.roomCode;
        document.getElementById('connectionText').textContent = `${player.nickname} · 卡牌定制`;
        document.getElementById('playerHint').textContent = `${player.nickname}，填写 1 张英雄卡后提交，等待所有玩家完成。`;

        const cards = document.getElementById('cards');
        for (let index = 0; index < cardCount; index += 1) {
          cards.appendChild(createCard(index, savedCards[index]));
        }

        document.querySelectorAll('.sound-button').forEach((button) => {
          button.addEventListener('click', playSound);
        });

        function enterGame() {
          if (enterGame.started) return;
          enterGame.started = true;
          submitButton.disabled = true;
          submitButton.textContent = '正在进入对局';
          setTimeout(() => { window.location.href = 'game.html'; }, 220);
        }

        function reflectRoomProgress(roomSnapshot) {
          if (!roomSnapshot) return;
          if (allHeroesReady(roomSnapshot)) {
            enterGame();
            return;
          }
          const submittedCount = roomSnapshot.players.filter((roomPlayer) => roomSnapshot.customizations?.[roomPlayer.id]?.cards?.length === cardCount).length;
          const remainingCount = roomSnapshot.players.length - submittedCount;
          const selfSubmitted = roomSnapshot.customizations?.[roomSession.playerId]?.cards?.length === cardCount;
          if (roomSnapshot.heroGeneration?.status === 'RUNNING') {
            const completed = roomSnapshot.heroGeneration.completedCount || 0;
            const total = roomSnapshot.heroGeneration.totalCount || roomSnapshot.players.length;
            document.getElementById('playerHint').textContent = `AI 正在理解人物并匹配技能，已完成 ${completed}/${total} 张。`;
            submitButton.disabled = true;
            submitButton.textContent = 'AI 正在生成';
            return;
          }
          if (roomSnapshot.heroGeneration?.status === 'FAILED') {
            document.getElementById('playerHint').textContent = roomSnapshot.heroGeneration.message || '生成失败，请重新提交。';
            submitButton.disabled = false;
            submitButton.textContent = '重新提交';
            return;
          }
          if (selfSubmitted) {
            document.getElementById('playerHint').textContent = `${player.nickname} 已提交，等待 ${remainingCount} 名玩家完成定制。`;
            submitButton.disabled = true;
            submitButton.textContent = '等待其他玩家';
          } else {
            document.getElementById('playerHint').textContent = `已有 ${submittedCount}/${roomSnapshot.players.length} 名玩家提交，请完成你的定制。`;
            submitButton.disabled = false;
            submitButton.textContent = '提交定制';
          }
        }

        if (room.phase === 'PLAYING' && allHeroesReady(room)) enterGame();
        else if (savedCards.length === cardCount) reflectRoomProgress(room);

        document.getElementById('customizeForm').addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!event.currentTarget.reportValidity()) return;

          const formData = new FormData(event.currentTarget);
          const submittedCards = [];
          for (let index = 0; index < cardCount; index += 1) {
            submittedCards.push({
              name: formData.get(`heroName${index}`).trim(),
              description: formData.get(`heroDescription${index}`).trim()
            });
          }

          submitButton.disabled = true;
          submitButton.textContent = '正在提交';
          try {
            const payload = await submitCustomization(roomSession.roomCode, roomSession.playerId, submittedCards);
            const latestRooms = getRooms();
            latestRooms[roomSession.roomCode] = payload.room;
            localStorage.setItem(roomStorageKey, JSON.stringify(latestRooms));
            reflectRoomProgress(payload.room);
            showToast(payload.generationStarted ? '全员已提交，AI 开始生成英雄。' : '英雄资料已提交。');
          } catch (error) {
            submitButton.disabled = false;
            submitButton.textContent = '提交定制';
            showToast(error.message || '提交失败，请稍后重试。');
          }
        });

        window.addEventListener('storage', (event) => {
          if (event.key !== roomStorageKey) return;
          const latestRoom = getRooms()[roomSession.roomCode];
          if (latestRoom) reflectRoomProgress(latestRoom);
        });
      }
    }
  </script>
</body>
</html>
