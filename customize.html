<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡牌定制 - 天下英雄杀</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #080b14;
      --surface: rgba(9, 13, 23, 0.91);
      --surface-soft: rgba(19, 25, 38, 0.78);
      --line: rgba(218, 227, 246, 0.18);
      --line-bright: rgba(225, 233, 250, 0.4);
      --text: #f1f3f7;
      --muted: #a9b1c1;
      --gold: #d7b466;
      --gold-light: #f0d18a;
      --red: #9b403b;
      --green: #81aaa0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-width: 1000px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    .scene {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url("imlobby.png") center / cover no-repeat;
      transform: scale(1.015);
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(4, 7, 14, 0.66), rgba(4, 7, 14, 0.34) 44%, rgba(4, 7, 14, 0.78)),
        linear-gradient(0deg, rgba(3, 5, 11, 0.78), transparent 52%);
    }

    .shell {
      width: min(1240px, calc(100% - 64px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 26px 0 22px;
    }

    .topbar,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .topbar {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-family: SimSun, STSong, serif;
      color: var(--gold-light);
      font-size: 23px;
      font-weight: 700;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(129, 170, 160, 0.7);
    }

    .main {
      padding: 30px 0;
    }

    .hero-panel {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 22px;
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top-color: var(--line-bright);
      border-radius: 6px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(10px);
    }

    .eyebrow {
      margin-bottom: 7px;
      color: var(--gold);
      font-size: 12px;
    }

    h1 {
      font-family: SimSun, STSong, serif;
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .panel-copy {
      margin-top: 10px;
      max-width: 610px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .room-code {
      color: var(--gold-light);
      font-family: Consolas, "Courier New", monospace;
      font-size: 30px;
      line-height: 1;
      white-space: nowrap;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      min-height: 410px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 16px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.015)),
        var(--surface-soft);
      border: 1px solid var(--line);
      border-top-color: rgba(215, 180, 102, 0.35);
      border-radius: 6px;
      box-shadow: 0 18px 52px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .card-title {
      color: var(--gold-light);
      font-family: SimSun, STSong, serif;
      font-size: 18px;
      font-weight: 700;
    }

    .card-number {
      color: var(--muted);
      font-size: 12px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field span {
      color: #dce1eb;
      font-size: 13px;
      font-weight: 700;
    }

    .review-card {
      min-height: 0;
    }

    .review-row {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 2px 10px;
      align-items: baseline;
      padding: 7px 0;
      border-bottom: 1px dashed var(--line);
    }

    .review-row:last-of-type {
      border-bottom: none;
    }

    .review-row > span {
      color: var(--muted);
      font-size: 12px;
    }

    .review-row strong {
      color: var(--gold-light);
      font-size: 14px;
    }

    .review-row small {
      grid-column: 2;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .review-flavor {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .generating-panel {
      display: grid;
      justify-items: center;
      gap: 14px;
      margin: 40px auto 0;
      padding: 46px 34px;
      max-width: 640px;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.015)),
        var(--surface-soft);
      border: 1px solid var(--line);
      border-top-color: rgba(215, 180, 102, 0.35);
      border-radius: 8px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    /* 关键修复：.generating-panel 设置了 display:grid，会覆盖浏览器默认的 [hidden]{display:none}，
       导致“AI 英雄卡牌工坊”提示在描述/确认阶段也一直显示。这里显式恢复 hidden 的隐藏行为。 */
    .generating-panel[hidden] {
      display: none;
    }

    .generating-title {
      color: var(--gold-light);
      font-family: SimSun, STSong, serif;
      font-size: 24px;
      font-weight: 700;
    }

    .generating-sub {
      color: var(--muted);
      font-size: 13px;
    }

    .generating-spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(217, 183, 109, 0.25);
      border-top-color: var(--gold-light);
      border-radius: 50%;
      animation: generating-spin 900ms linear infinite;
    }

    @keyframes generating-spin {
      to { transform: rotate(360deg); }
    }

    .progress-track {
      width: 100%;
      height: 10px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 5px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--red), var(--gold));
      border-radius: 5px;
      transition: width 300ms ease;
    }

    .generating-count {
      color: var(--gold-light);
      font-size: 14px;
      font-weight: 700;
    }

    .generating-tip {
      color: var(--muted);
      font-size: 12px;
    }

    input,
    textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--line);
      border-radius: 4px;
      outline: none;
    }

    input {
      min-height: 44px;
      padding: 10px 12px;
    }

    textarea {
      min-height: 205px;
      resize: none;
      padding: 12px;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(217, 181, 104, 0.1);
    }

    input::placeholder,
    textarea::placeholder {
      color: #70798c;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 22px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      backdrop-filter: blur(10px);
    }

    .hint {
      margin-right: auto;
      color: var(--muted);
      font-size: 13px;
    }

    .submit-button {
      min-width: 150px;
      min-height: 46px;
      border-radius: 4px;
      cursor: pointer;
      background: var(--red);
      border: 1px solid rgba(238, 173, 143, 0.46);
      font-weight: 700;
    }

    .submit-button:hover,
    .submit-button:focus-visible {
      background: #aa4842;
      outline: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 10;
      width: min(460px, calc(100% - 32px));
      padding: 13px 18px;
      background: rgba(8, 12, 20, 0.96);
      border: 1px solid var(--line-bright);
      border-radius: 4px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      text-align: center;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 1180px) {
      .cards {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">天下英雄杀</div>
      <div class="connection">
        <span class="connection-dot" aria-hidden="true"></span>
        <span id="connectionText">卡牌定制</span>
      </div>
    </header>

    <main class="main">
      <section class="hero-panel" aria-labelledby="customize-title">
        <div>
          <p class="eyebrow">AI 卡牌工坊</p>
          <h1 id="customize-title">定制你的英雄卡</h1>
          <p class="panel-copy">描述人物身份、性格和擅长方向。AI 会从受控技能库中匹配技能与数值，服务端校验通过后进入对局。</p>
        </div>
        <strong class="room-code" id="roomCode">------</strong>
      </section>

      <form id="customizeForm">
        <section class="cards" id="cards" aria-label="英雄定制卡片"></section>

        <div class="actions">
          <p class="hint" id="playerHint">填写完成后提交，所有玩家完成后进入对局。</p>
          <button class="submit-button sound-button" type="submit">提交定制</button>
        </div>
      </form>

      <section class="generating-panel" id="generatingPanel" hidden aria-live="polite">
        <div class="generating-title">AI 英雄卡牌工坊</div>
        <div class="generating-sub">正在为玩家制作英雄卡，请勿关闭页面…</div>
        <div class="generating-spinner" aria-hidden="true"></div>
        <div class="progress-track"><div class="progress-fill" id="generatingProgress"></div></div>
        <p class="generating-count" id="generatingCount">已完成 0 / 20 张</p>
        <p class="generating-tip">AI 正在理解人物描述并从技能库中匹配主技能、副技能与特技。</p>
      </section>
    </main>

    <footer class="footer">
      <span>AI 生成 · 服务端规则校验</span>
      <span id="cardCountHint">测试阶段 · 每名玩家 5 张英雄卡</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="buttonSound" src="按钮声音.mp3" preload="auto"></audio>
  <script src="network.js"></script>

  <script>
    const roomStorageKey = 'heroKillLocalRooms';
    const sessionStorageKey = 'heroKillRoomSession';
    // 【临时测试配置】每名玩家定制的英雄卡数量（正式为 5，测试期改为 3）。
    const cardCount = 3;
    let roomSession;

    try {
      roomSession = JSON.parse(sessionStorage.getItem(sessionStorageKey) || localStorage.getItem(sessionStorageKey));
    } catch {
      roomSession = null;
    }
    function getRooms() {
      try {
        return JSON.parse(localStorage.getItem(roomStorageKey)) || {};
      } catch {
        return {};
      }
    }

    function saveRooms(rooms) {
      if (window.HeroKillNet) return window.HeroKillNet.saveRooms(rooms);
      localStorage.setItem(roomStorageKey, JSON.stringify(rooms));
      return Promise.resolve(rooms);
    }

    function allPlayersSubmitted(room) {
      return Boolean(room?.players?.length) && room.players.every((roomPlayer) => {
        const submission = room.customizations?.[roomPlayer.id];
        return submission?.cards?.length === cardCount;
      });
    }

    function allHeroesReady(room) {
      return room?.heroGeneration?.status === 'READY'
        && Boolean(room?.players?.length)
        && room.players.every((roomPlayer) => room.generatedHeroes?.[roomPlayer.id]);
    }

    function allConfirmed(room) {
      return Boolean(room?.players?.length) && room.players.every((roomPlayer) => room.confirmations?.[roomPlayer.id]);
    }

    async function submitCustomization(roomCode, playerId, cards) {
      const response = await fetch(`/api/rooms/${roomCode}/customizations`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId, cards })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.message || `提交失败：${response.status}`);
      return payload;
    }

    function playSound() {
      const sound = document.getElementById('buttonSound');
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      clearTimeout(showToast.timer);
      toast.textContent = message;
      toast.classList.add('visible');
      showToast.timer = setTimeout(() => toast.classList.remove('visible'), 2600);
    }

    function createCard(index, savedCard) {
      const article = document.createElement('article');
      article.className = 'card';
      article.innerHTML = `
        <div class="card-head">
          <span class="card-title">空白英雄卡</span>
          <span class="card-number">${String(index + 1).padStart(2, '0')}</span>
        </div>
        <label class="field">
          <span>英雄名称</span>
          <input name="heroName${index}" type="text" maxlength="16" placeholder="例如：奥特曼" required autocomplete="off">
        </label>
        <label class="field">
          <span>英雄描述</span>
          <textarea name="heroDescription${index}" maxlength="120" placeholder="描述人物特征、擅长方向或你希望技能体现的风格，比如：奥特曼来自光之国，打怪兽猛猛的。" required></textarea>
        </label>
      `;

      if (savedCard) {
        article.querySelector('input').value = savedCard.name || '';
        article.querySelector('textarea').value = savedCard.description || '';
      }

      return article;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function renderReviewCards(heroes) {
      return heroes.map((hero, index) => `
        <article class="card review-card">
          <div class="card-head">
            <span class="card-title">${escapeHtml(hero.heroName)}</span>
            <span class="card-number">${String(index + 1).padStart(2, '0')}</span>
          </div>
          <div class="review-row"><span>血量</span><strong>${hero.maxHp || 5}</strong></div>
          <div class="review-row"><span>主技能</span><strong>${escapeHtml(hero.primarySkill?.name || '')}</strong><small>${escapeHtml(hero.primarySkill?.description || '')}</small></div>
          <div class="review-row"><span>副技能</span><strong>${escapeHtml(hero.secondarySkill?.name || '')}</strong><small>${escapeHtml(hero.secondarySkill?.description || '')}</small></div>
          <div class="review-row"><span>特技</span><strong>${escapeHtml(hero.specialSkill?.name || '')}</strong><small>${escapeHtml(hero.specialSkill?.description || '')}</small></div>
          <p class="review-flavor">${escapeHtml(hero.flavorText || '')}</p>
        </article>
      `).join('');
    }

    if (!roomSession || !/^\d{6}$/.test(roomSession.roomCode)) {
      window.location.replace('lobby.html');
    } else {
      const rooms = getRooms();
      const room = rooms[roomSession.roomCode];
      const player = room?.players.find((item) => item.id === roomSession.playerId);

      if (!room || !player) {
        sessionStorage.removeItem(sessionStorageKey);
        localStorage.removeItem(sessionStorageKey);
        window.location.replace('lobby.html');
      } else {
        const submitButton = document.querySelector('.submit-button');
        const hintEl = document.getElementById('playerHint');
        const cardsEl = document.getElementById('cards');
        const customizeForm = document.getElementById('customizeForm');
        const generatingPanel = document.getElementById('generatingPanel');
        const generatingProgress = document.getElementById('generatingProgress');
        const generatingCount = document.getElementById('generatingCount');
        const savedCards = room.customizations?.[roomSession.playerId]?.cards || [];
        document.getElementById('roomCode').textContent = roomSession.roomCode;
        document.getElementById('connectionText').textContent = `${player.nickname} · 卡牌定制`;
        document.getElementById('cardCountHint').textContent = `测试阶段 · 每名玩家 ${cardCount} 张英雄卡`;
        cardsEl.style.gridTemplateColumns = `repeat(${cardCount}, minmax(0, 1fr))`;

        function showGenerating(completed, total) {
          customizeForm.hidden = true;
          generatingPanel.hidden = false;
          const percent = total ? Math.min(100, Math.round((completed / total) * 100)) : 0;
          generatingProgress.style.width = `${percent}%`;
          generatingCount.textContent = `已完成 ${completed} / ${total} 张`;
        }

        function hideGenerating() {
          customizeForm.hidden = false;
          generatingPanel.hidden = true;
        }

        function renderForm() {
          cardsEl.replaceChildren();
          for (let index = 0; index < cardCount; index += 1) {
            cardsEl.appendChild(createCard(index, savedCards[index]));
          }
        }

        function enterGame() {
          if (enterGame.started) return;
          enterGame.started = true;
          submitButton.disabled = true;
          submitButton.textContent = '正在进入对局';
          setTimeout(() => { window.location.href = 'game.html'; }, 220);
        }

        function enterSelect() {
          if (enterSelect.started) return;
          enterSelect.started = true;
          submitButton.disabled = true;
          submitButton.textContent = '正在进入选将';
          setTimeout(() => { window.location.href = 'select.html'; }, 220);
        }

        async function confirmHeroes() {
          if (confirmHeroes.running) return;
          confirmHeroes.running = true;
          submitButton.disabled = true;
          submitButton.textContent = '正在确认';
          try {
            const response = await fetch(`/api/rooms/${roomSession.roomCode}/confirmations`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ playerId: roomSession.playerId })
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.message || `确认失败：${response.status}`);
            const latestRooms = getRooms();
            latestRooms[roomSession.roomCode] = payload.room;
            localStorage.setItem(roomStorageKey, JSON.stringify(latestRooms));
            reflectRoomProgress(payload.room);
            showToast('已确认，等待其他玩家确认。');
          } catch (error) {
            submitButton.disabled = false;
            submitButton.textContent = '确认英雄';
            try {
              if (window.HeroKillNet) await HeroKillNet.loadRooms();
              const latestRoom = getRooms()[roomSession.roomCode];
              if (latestRoom) {
                const latestRooms = getRooms();
                latestRooms[roomSession.roomCode] = latestRoom;
                localStorage.setItem(roomStorageKey, JSON.stringify(latestRooms));
                reflectRoomProgress(latestRoom);
              }
            } catch (syncError) {
              // 忽略同步失败
            }
            if (submitButton.textContent !== '已确认' && !submitButton.onclick) {
              submitButton.disabled = false;
              submitButton.textContent = '确认英雄';
              showToast(error.message || '确认失败，请稍后重试。');
            }
          } finally {
            confirmHeroes.running = false;
          }
        }

        function reflectRoomProgress(roomSnapshot) {
          if (!roomSnapshot) return;
          if (roomSnapshot.phase === 'PLAYING') {
            // 新流程：finalHeroes 就绪即进对局；旧版/兼容场景：英雄已就绪也直接进对局
            if (roomSnapshot.finalHeroes || allHeroesReady(roomSnapshot)) {
              enterGame();
              return;
            }
          }
          if (roomSnapshot.phase === 'SELECTING') {
            enterSelect();
            return;
          }
          if (roomSnapshot.phase === 'REVIEWING' || roomSnapshot.heroGeneration?.status === 'READY') {
            const myHeroes = roomSnapshot.generatedHeroes?.[roomSession.playerId];
            if (Array.isArray(myHeroes) && myHeroes.length === cardCount) {
              hideGenerating();
              cardsEl.innerHTML = renderReviewCards(myHeroes);
              const selfConfirmed = Boolean(roomSnapshot.confirmations?.[roomSession.playerId]);
              if (selfConfirmed) {
                hintEl.textContent = `你已确认这 ${cardCount} 张英雄卡，等待其他玩家确认后进入选将。`;
                submitButton.disabled = true;
                submitButton.textContent = '已确认';
                submitButton.onclick = null;
              } else {
                hintEl.textContent = `${player.nickname}，请确认 AI 为你制作的 ${cardCount} 张英雄卡；确认后系统将洗乱全部 ${roomSnapshot.players.length * cardCount} 张随机分发。`;
                submitButton.disabled = false;
                submitButton.textContent = '确认英雄';
                submitButton.onclick = confirmHeroes;
              }
              return;
            }
            // 英雄已生成但本地尚未同步到本玩家的英雄（例如刚刷新/切换标签页），
            // 避免误回退到“提交定制”表单：保持工坊隐藏，提示正在同步确认阶段。
            hideGenerating();
            cardsEl.innerHTML = '';
            hintEl.textContent = '英雄卡已生成完成，正在同步确认阶段，请稍候…';
            submitButton.disabled = true;
            submitButton.textContent = '正在同步';
            submitButton.onclick = null;
            return;
          }
          submitButton.onclick = null;
          hideGenerating();
          if (!cardsEl.querySelector('input')) renderForm();
          const submittedCount = roomSnapshot.players.filter((roomPlayer) => Boolean(roomSnapshot.customizations?.[roomPlayer.id]?.submittedAt)).length;
          const remainingCount = roomSnapshot.players.length - submittedCount;
          const selfSubmitted = Boolean(roomSnapshot.customizations?.[roomSession.playerId]?.submittedAt);
          if (roomSnapshot.heroGeneration?.status === 'RUNNING') {
            const completed = roomSnapshot.heroGeneration.completedCount || 0;
            const total = roomSnapshot.heroGeneration.totalCount || roomSnapshot.players.length * cardCount;
            showGenerating(completed, total);
            return;
          }
          if (roomSnapshot.heroGeneration?.status === 'FAILED') {
            hintEl.textContent = roomSnapshot.heroGeneration.message || '生成失败，请重新提交。';
            submitButton.disabled = false;
            submitButton.textContent = '重新提交';
            return;
          }
          if (selfSubmitted) {
            hintEl.textContent = `${player.nickname} 已提交，等待 ${remainingCount} 名玩家完成定制。`;
            submitButton.disabled = true;
            submitButton.textContent = '等待其他玩家';
          } else {
            hintEl.textContent = `已有 ${submittedCount}/${roomSnapshot.players.length} 名玩家提交，请完成你的 ${cardCount} 张英雄卡。`;
            submitButton.disabled = false;
            submitButton.textContent = '提交定制';
          }
        }

        document.querySelectorAll('.sound-button').forEach((button) => {
          button.addEventListener('click', playSound);
        });

        if (room.phase === 'PLAYING' && (room.finalHeroes || allHeroesReady(room))) enterGame();
        else if (room.phase === 'SELECTING') enterSelect();
        else if (room.phase === 'REVIEWING' && Array.isArray(room.generatedHeroes?.[roomSession.playerId]) && room.generatedHeroes[roomSession.playerId].length === cardCount) reflectRoomProgress(room);
        else {
          renderForm();
          reflectRoomProgress(room);
        }

        // 主动同步服务器最新房间状态，避免本地 localStorage 滞后导致计数/阶段显示错误
        if (window.HeroKillNet) {
          HeroKillNet.loadRooms()
            .then(() => {
              const latestRoom = getRooms()[roomSession.roomCode];
              if (latestRoom) reflectRoomProgress(latestRoom);
            })
            .catch(() => {});
        }

        customizeForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (submitButton.onclick) {
            submitButton.onclick();
            return;
          }
          if (!event.currentTarget.reportValidity()) return;

          const formData = new FormData(event.currentTarget);
          const submittedCards = [];
          for (let index = 0; index < cardCount; index += 1) {
            submittedCards.push({
              name: formData.get(`heroName${index}`).trim(),
              description: formData.get(`heroDescription${index}`).trim()
            });
          }

          submitButton.disabled = true;
          submitButton.textContent = '正在提交';
          try {
            const payload = await submitCustomization(roomSession.roomCode, roomSession.playerId, submittedCards);
            const latestRooms = getRooms();
            latestRooms[roomSession.roomCode] = payload.room;
            localStorage.setItem(roomStorageKey, JSON.stringify(latestRooms));
            reflectRoomProgress(payload.room);
            showToast(payload.generationStarted ? '全员已提交，AI 开始生成英雄。' : '英雄资料已提交。');
          } catch (error) {
            // 服务端可能已进入生成/确认/选将/对局阶段（本地状态滞后）。
            // 先同步服务器状态并重新渲染，避免停留在表单反复提交 409。
            try {
              if (window.HeroKillNet) await HeroKillNet.loadRooms();
              const latestRoom = getRooms()[roomSession.roomCode];
              if (latestRoom) {
                const latestRooms = getRooms();
                latestRooms[roomSession.roomCode] = latestRoom;
                localStorage.setItem(roomStorageKey, JSON.stringify(latestRooms));
                reflectRoomProgress(latestRoom);
              }
            } catch (syncError) {
              // 同步失败时保留原错误提示
            }
            if (!submitButton.onclick) {
              submitButton.disabled = false;
              submitButton.textContent = '提交定制';
              showToast(error.message || '提交失败，请稍后重试。');
            }
          }
        });

        window.addEventListener('storage', (event) => {
          if (event.key !== roomStorageKey) return;
          const latestRoom = getRooms()[roomSession.roomCode];
          if (latestRoom) reflectRoomProgress(latestRoom);
        });
      }
    }
  </script>
</body>
</html>
